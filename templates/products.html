
<!DOCTYPE html>
<html>
<head>
    <title>Electronics Products</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 30px;
        }

        h1 {
            text-align: center;
        }

        .products {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .product {
            background: white;
            padding: 20px;
            width: 220px;
            border-radius: 10px;
            text-align: center;
        }

        button {
            padding: 10px;
            background: #222;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Electronics Store</h1>

    <div class="products">
        {% for product in products %}
        <div class="product">
            <h3>{{ product.name }}</h3>
            <p>Price: ₹{{ product.price }}</p>
            <p>Stock: {{ product.stock }}</p>

            <form action="{{ url_for('cart.add_to_cart', product_id=product.id) }}" method="POST">
                <input type="number" name="quantity" value="1" min="1" max="{{ product.stock }}">
                <button type="submit">Add to Cart</button>
            </form>
        </div>
        {% else %}
        <p>No products available yet.</p>
        {% endfor %}
    </div>

</body>
</html>
